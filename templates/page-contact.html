<main class="contact-page" id="main-content"><header class="signal-hero signal-hero--page signal-art--c"><div class="signal-hero__field" aria-hidden="true"></div><div class="signal-hero__inner"><p class="signal-kicker">Contact / Open channel</p><h1 class="signal-title" data-text="{{title}}">{{title}}</h1><p class="signal-lede">For thoughtful conversations about software systems, developer tools, agent workflows, publishing, and open-source work.</p></div></header><div class="contact-layout sk-container"><article class="page-content">{{body}}</article><form class="contact-form" data-contact-form action="mailto:hello@robertdevore.com" method="post" enctype="text/plain"><div><label for="contact-name">Name</label><input id="contact-name" name="name" type="text" autocomplete="name" required></div><div><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" required></div><div><label for="contact-subject">Subject</label><input id="contact-subject" name="subject" type="text" required></div><div><label for="contact-link">Relevant link <span>(optional)</span></label><input id="contact-link" name="link" type="url" inputmode="url" placeholder="https://"></div><div><label for="contact-message">What should I know?</label><textarea id="contact-message" name="message" rows="8" required></textarea></div><button class="sk-button" type="submit">Open email draft</button><p class="contact-form__note">This form keeps your message private by opening a draft in your email app. Nothing is stored on this site.</p></form></div></main>
