name: Deploy Kujo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install Python dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Build the pinned Kujo runtime
        shell: bash
        run: |
          set -euo pipefail
          kujo_revision="$(python3 -c 'import json; print(json.load(open("workspace-dependencies.json"))["runtime"]["revision"])')"
          kujo_root="${RUNNER_TEMP}/kujo"
          git init "${kujo_root}"
          git -C "${kujo_root}" remote add origin https://github.com/kujolang/kujo.git
          git -C "${kujo_root}" fetch --depth=1 origin "${kujo_revision}"
          git -C "${kujo_root}" checkout --detach FETCH_HEAD
          cargo build --release --locked --manifest-path "${kujo_root}/Cargo.toml"
          echo "KUJO_ROOT=${kujo_root}" >> "${GITHUB_ENV}"

      - name: Build and validate the site
        run: |
          ./scripts/build.sh
          python3 scripts/validate_site.py output
          python3 scripts/verify_homepage.py output
          cp CNAME output/CNAME
          touch output/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
