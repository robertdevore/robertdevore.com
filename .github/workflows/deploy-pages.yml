name: Deploy Kujo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install Python dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Install Kujo 1.0.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.0.1/kujo-v1.0.1-linux-x64.tar.gz
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.0.1/kujo-v1.0.1-linux-x64.tar.gz.sha256
          sha256sum --check kujo-v1.0.1-linux-x64.tar.gz.sha256
          mkdir -p "${RUNNER_TEMP}/kujo-bin"
          tar -xzf kujo-v1.0.1-linux-x64.tar.gz -C "${RUNNER_TEMP}/kujo-bin"
          echo "KUJO_BIN=${RUNNER_TEMP}/kujo-bin/kujo" >> "${GITHUB_ENV}"

      - name: Build and validate the site
        run: |
          rm -rf output
          "$KUJO_BIN" run ./build.kujo -- --site-url https://robertdevore.com
          python3 scripts/inline_critical_css.py output
          python3 scripts/harden_generated_output.py output
          python3 scripts/validate_site.py output
          python3 scripts/verify_homepage.py output
          ./scripts/validate_html.sh output
          cp CNAME output/CNAME
          touch output/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
